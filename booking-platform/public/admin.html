<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Supreme Air Duct Service</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#2a1c12" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c2410c'/%3E%3Cpath d='M9 20c2-5 5-7 7-7s2 3 4 3 3-2 3-2' stroke='%23fcd9a8' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="admin-body">

  <!-- LOGIN -->
  <div class="login-wrap" id="loginWrap">
    <div class="login-card">
      <a class="brand" style="justify-content:center;">
        <svg class="brand__mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="48" height="48" rx="12" fill="#c2410c"/>
          <path d="M11 29c4-9 9-12 13-12s4 5 7 5 5-3 5-3" stroke="#fff5e9" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M11 35c4-9 9-12 13-12s4 5 7 5 5-3 5-3" stroke="#fcd9a8" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M11 23c4-9 9-12 13-12s4 5 7 5 5-3 5-3" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>
        <span class="brand__text"><span class="brand__name">Supreme Air Duct</span><span class="brand__sub">Admin</span></span>
      </a>
      <h1>Staff sign in</h1>
      <p>Enter your admin password to manage appointments.</p>
      <form id="loginForm">
        <div class="field"><input type="password" id="pw" placeholder="Password" autocomplete="current-password" /></div>
        <button class="btn btn--primary btn--block" type="submit">Sign in</button>
        <div class="book-err" id="loginErr"></div>
      </form>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dash" hidden>
    <header class="admin-topbar">
      <div class="container">
        <a href="/" class="brand">
          <svg class="brand__mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="48" height="48" rx="12" fill="#c2410c"/>
            <path d="M11 29c4-9 9-12 13-12s4 5 7 5 5-3 5-3" stroke="#fff5e9" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M11 35c4-9 9-12 13-12s4 5 7 5 5-3 5-3" stroke="#fcd9a8" stroke-width="3" fill="none" stroke-linecap="round"/>
          </svg>
          <span class="brand__text"><span class="brand__name">Supreme Air Duct</span><span class="brand__sub">Admin Dashboard</span></span>
        </a>
        <div class="admin-actions">
          <a href="/" target="_blank">View site ↗</a>
          <button id="refreshBtn">Refresh</button>
          <button class="btn btn--ghost" id="logoutBtn" style="padding:8px 16px;">Sign out</button>
        </div>
      </div>
    </header>

    <main class="admin-main">
      <div class="container">
        <div class="admin-stats" id="stats"></div>

        <div class="admin-toolbar">
          <h2>Appointments</h2>
          <button class="filter-chip active" data-filter="all">All</button>
          <button class="filter-chip" data-filter="upcoming">Upcoming</button>
          <button class="filter-chip" data-filter="pending">Pending</button>
          <button class="filter-chip" data-filter="confirmed">Confirmed</button>
          <button class="filter-chip" data-filter="completed">Completed</button>
          <button class="filter-chip" data-filter="cancelled">Cancelled</button>
        </div>

        <div class="appt-table-wrap">
          <table class="appts">
            <thead>
              <tr><th>Ref</th><th>When</th><th>Service</th><th>Customer</th><th>Location</th><th>Status</th><th></th></tr>
            </thead>
            <tbody id="apptBody"></tbody>
          </table>
          <div class="admin-empty" id="emptyState" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <p>No appointments here yet.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
