name: Deploy redesign to GitHub Pages

# Publishes the static marketing site in redesign/ to GitHub Pages.
# Auto-enables Pages on first run, so no manual setup is required.
on:
  push:
    branches: ["claude/supreme-air-duct-redesign-hgRbj"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs cancel in-progress ones.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site (redesign/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: redesign

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
